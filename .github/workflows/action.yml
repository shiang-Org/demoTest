name: CI/CD Fullstack Build and Deploy
run-name: Build and Deploy

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Build Frontend (React)
        working-directory: demoClass_front
        run: |
          npm install
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build Backend (Spring Boot)
        working-directory: demoClass_back
        run: |
          .\mvnw.cmd clean package -DskipTests

      - name: Deploy Versioned Releases and Switch Current
        run: |
          #$branchName 取自 ${{ github.ref_name }}（例如 v1.0.1 或 main）
          #並把非英數、點、底線、連字號的字元替換成 _
          $branchName = "${{ github.ref_name }}" -replace '[^a-zA-Z0-9._-]', '_'
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          #$shortSha = git rev-parse --short HEAD
          $releaseName = "$branchName-$shortSha"

          $frontBase = "C:\nginx\nginx-1.30.7\html\demoClass"
          $frontReleaseDir = "$frontBase\releases\$releaseName"
          $frontCurrentLink = "$frontBase\current"

          $backBase = "C:\SpringBoot\demoClass"
          $backReleaseDir = "$backBase\releases\$releaseName"
          $backCurrentLink = "$backBase\current"
          $jarName = "demoClass-0.0.1-SNAPSHOT.jar"
          $serviceName = "DemoClassService"

          #確保前後端各自的 releases\<版本> 資料夾存在
          New-Item -ItemType Directory -Force -Path $frontReleaseDir | Out-Null
          New-Item -ItemType Directory -Force -Path $backReleaseDir | Out-Null

          Copy-Item -Recurse -Force "demoClass_front\dist\*" $frontReleaseDir

          #後端從 demoClass_back\target\*.jar 排除 *.original 後挑出打包好的 JAR
          $jarFile = Get-ChildItem -Path "demoClass_back\target\*.jar" | Where-Object { $_.Name -notlike "*.original" } | Select-Object -First 1
          if ($null -eq $jarFile) {
              throw "No built JAR file found in demoClass_back\target"
          }
          Copy-Item -Force $jarFile.FullName "$backReleaseDir\$jarName"
          
          #停止後端服務（避免檔案鎖定）
          $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($null -ne $svc -and $svc.Status -eq 'Running') {
              Write-Host "Stopping service $serviceName..."
              Stop-Service -Name $serviceName -Force
              $svc.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(30))
          }

          #重建前後端 current 符號連結
          if (Test-Path $frontCurrentLink) {
              Remove-Item $frontCurrentLink -Force -Recurse
          }
          New-Item -ItemType SymbolicLink -Path $frontCurrentLink -Target $frontReleaseDir | Out-Null

          if (Test-Path $backCurrentLink) {
              Remove-Item $backCurrentLink -Force -Recurse
          }
          New-Item -ItemType SymbolicLink -Path $backCurrentLink -Target $backReleaseDir | Out-Null

          #啟動後端服務並重載 Nginx
          if ($null -ne $svc) {
              Write-Host "Starting service $serviceName..."
              Start-Service -Name $serviceName
              $svc.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          }

          & "C:\nginx\nginx-1.30.7\nginx.exe" -p "C:\nginx\nginx-1.30.7" -s reload
          Write-Host "Deployed $releaseName and switched current links."