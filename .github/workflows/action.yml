name: GitHub Actions Demo
run-name: GitHub Actions Demo

# 觸發此 action 的時機
on:
  push:
    branches:  # 修正原本拼錯的 branchs 為 branches
      - '*'
  workflow_dispatch:  # 可以手動執行此 action

# 預先定義此 action 要幹嘛
jobs:
  demo-test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Test SFTP Connection to Windows Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "."
          # 修正：避開帶有冒號的絕對路徑，改用 OpenSSH 預設家目錄下的相對路徑
          target: "SpringBoot/demoClass/"
          overwrite: false
          rm: false

      - name: Echo Success
        run: echo '執行成功'
