name: GitHub Actions Demo
run-name: GitHub Actions Demo

# 觸發此 action 的時機
on:
  push:
    branches:  # 修正原本拼錯的 branchs 為 branches
      - '*'
  workflow_dispatch:  # 可以手動執行此 action

# 預先定義此 action 要幹嘛
jobs:
  demo-test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Test SFTP Connection to Windows Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: ".github/workflows/action.yml" # 改成傳送這個設定檔本身，檔案極小
          target: "C:/SpringBoot/demoClass/"
          overwrite: true
          rm: false

      - name: Echo Success
        run: echo '執行成功'
